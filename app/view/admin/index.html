<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - 信息技术课刷题考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f5f7fa; }
        
        .sidebar {
            width: 220px;
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            position: fixed;
            left: 0;
            top: 0;
            color: white;
            padding: 20px 0;
        }
        
        .sidebar .logo {
            text-align: center;
            padding: 0 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 20px;
        }
        
        .sidebar .logo h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .sidebar .menu {
            list-style: none;
        }
        
        .sidebar .menu li {
            margin-bottom: 5px;
        }
        
        .sidebar .menu li a {
            display: block;
            padding: 12px 20px;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .sidebar .menu li a:hover,
        .sidebar .menu li a.active {
            background: rgba(255,255,255,0.1);
            border-left-color: white;
            color: white;
        }
        
        .sidebar .menu li a i {
            margin-right: 10px;
        }
        
        .sidebar .user-info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        
        .sidebar .user-info p {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .sidebar .user-info a {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-decoration: none;
        }
        
        .main-content {
            margin-left: 220px;
            padding: 20px;
        }
        
        .main-content .header {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .main-content .header h2 {
            font-size: 18px;
            color: #333;
        }
        
        .main-content .header .date {
            color: #999;
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        
        .stat-card .icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .stat-card .icon.student { background: #e6f7ff; color: #1890ff; }
        .stat-card .icon.teacher { background: #f6ffed; color: #52c41a; }
        .stat-card .icon.course { background: #fff7e6; color: #fa8c16; }
        .stat-card .icon.question { background: #f9f0ff; color: #722ed1; }
        .stat-card .icon.class { background: #fff1f0; color: #f5222d; }
        
        .stat-card .value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #999;
        }
        
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar .logo h1, .sidebar .menu li a span, .sidebar .user-info { display: none; }
            .sidebar .menu li a { text-align: center; border-left: none; }
            .main-content { margin-left: 60px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h1>刷题考试系统</h1>
        </div>
        
        <ul class="menu">
            <li><a href="/admin" class="active"><i>📊</i><span>数据概览</span></a></li>
            <li><a href="/admin/users"><i>👥</i><span>用户管理</span></a></li>
            <li><a href="/admin/courses"><i>📚</i><span>课程管理</span></a></li>
            <li><a href="/admin/classes"><i>🏫</i><span>班级管理</span></a></li>
            <li><a href="/admin/questions"><i>📝</i><span>题库管理</span></a></li>
            <li><a href="/admin/system"><i>⚙️</i><span>系统设置</span></a></li>
        </ul>
        
        <div class="user-info">
            <p>管理员：{$user.real_name}</p>
            <a href="/admin/logout">退出登录</a>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h2>数据概览</h2>
            <span class="date">{:date('Y年m月d日 H:i')}</span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon student">👨‍🎓</div>
                <div class="value">{$studentCount}</div>
                <div class="label">学生总数</div>
            </div>
            <div class="stat-card">
                <div class="icon teacher">👨‍🏫</div>
                <div class="value">{$teacherCount}</div>
                <div class="label">教师总数</div>
            </div>
            <div class="stat-card">
                <div class="icon course">📚</div>
                <div class="value">{$courseCount}</div>
                <div class="label">课程总数</div>
            </div>
            <div class="stat-card">
                <div class="icon question">📝</div>
                <div class="value">{$questionCount}</div>
                <div class="label">题目总数</div>
            </div>
            <div class="stat-card">
                <div class="icon class">🏫</div>
                <div class="value">{$classCount}</div>
                <div class="label">班级总数</div>
            </div>
        </div>
    </div>
</body>
</html>

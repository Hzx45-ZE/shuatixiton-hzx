<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 信息技术课刷题考试系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 45px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .admin-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d9ff, #7c3aed, #f43f5e);
        }

        .admin-header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .admin-header h1 {
            font-size: 26px;
            color: white;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .admin-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 15px;
            color: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #7c3aed;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .captcha-group {
            display: flex;
            gap: 12px;
        }

        .captcha-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .captcha-img {
            width: 120px;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .captcha-img:hover {
            transform: scale(1.05);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #7c3aed 0%, #00d9ff 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: white;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>管理员登录</h1>
            <p>系统管理后台</p>
        </div>

        <div class="alert" id="alert"></div>

        <form id="adminForm">
            <div class="form-group">
                <label for="username">管理员账号</label>
                <input type="text" id="username" name="username" placeholder="请输入管理员账号" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <div class="captcha-group">
                <div class="form-group">
                    <label for="captcha">验证码</label>
                    <input type="text" id="captcha" name="captcha" placeholder="请输入验证码" required maxlength="4">
                </div>
                <div style="margin-top: 26px;">
                    <img src="/admin/captcha" alt="验证码" class="captcha-img" id="captchaImg" onclick="refreshCaptcha()">
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">登 录</span>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div class="back-link">
            <a href="/login">← 返回用户登录</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('adminForm');
            const alertDiv = document.getElementById('alert');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const captcha = document.getElementById('captcha').value;

                if (!username || !password) {
                    showAlert('请输入账号和密码', 'error');
                    return;
                }

                if (!captcha) {
                    showAlert('请输入验证码', 'error');
                    return;
                }

                btnText.style.display = 'none';
                loader.style.display = 'block';
                loginBtn.disabled = true;

                fetch('/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&captcha=${encodeURIComponent(captcha)}`
                })
                .then(response => response.json())
                .then(data => {
                    btnText.style.display = 'block';
                    loader.style.display = 'none';
                    loginBtn.disabled = false;

                    if (data.code === 1) {
                        showAlert(data.msg, 'success');
                        setTimeout(() => {
                            window.location.href = data.url;
                        }, 1500);
                    } else {
                        refreshCaptcha();
                        showAlert(data.msg, 'error');
                    }
                })
                .catch(error => {
                    btnText.style.display = 'block';
                    loader.style.display = 'none';
                    loginBtn.disabled = false;
                    showAlert('网络错误，请稍后重试', 'error');
                });
            });
        });

        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = msg;
            alertDiv.className = `alert ${type}`;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        function refreshCaptcha() {
            const captchaImg = document.getElementById('captchaImg');
            captchaImg.src = '/admin/captcha?' + Math.random();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 信息技术课刷题考试系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
            border-radius: 50%;
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }

        .register-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .role-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .role-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #667eea;
        }

        .role-btn:hover {
            border-color: #667eea;
        }

        .captcha-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .captcha-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .captcha-img {
            width: 120px;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #e0e0e0;
            transition: transform 0.3s ease;
        }

        .captcha-img:hover {
            transform: scale(1.05);
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            position: relative;
            z-index: 1;
        }

        .form-footer a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .form-footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .form-footer span {
            color: #999;
            margin: 0 10px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            position: relative;
            z-index: 1;
        }

        .alert.error {
            background: #fff5f5;
            color: #dc2626;
            border: 1px solid #fee2e2;
        }

        .alert.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tip {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>用户注册</h1>
            <p>创建您的账号，开始学习之旅</p>
        </div>

        <div class="alert" id="alert"></div>

        <form id="registerForm">
            <div class="role-selector">
                <button type="button" class="role-btn active" data-role="1">我是学生</button>
                <button type="button" class="role-btn" data-role="2">我是教师</button>
            </div>

            <input type="hidden" id="role" name="role" value="1">

            <div class="form-group">
                <label for="username">账号 <span style="color: #ef4444;">*</span></label>
                <input type="text" id="username" name="username" placeholder="请输入学号/工号" required>
                <div class="tip">账号将作为登录凭证，请牢记</div>
            </div>

            <div class="form-group">
                <label for="real_name">真实姓名 <span style="color: #ef4444;">*</span></label>
                <input type="text" id="real_name" name="real_name" placeholder="请输入真实姓名" required>
            </div>

            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" name="phone" placeholder="请输入手机号（选填）">
            </div>

            <div class="form-group">
                <label for="password">密码 <span style="color: #ef4444;">*</span></label>
                <input type="password" id="password" name="password" placeholder="请输入密码（至少6位）" required>
                <div class="tip">密码长度至少6位，建议包含字母和数字</div>
            </div>

            <div class="form-group">
                <label for="confirm_password">确认密码 <span style="color: #ef4444;">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
            </div>

            <div class="captcha-group">
                <div class="form-group">
                    <label for="captcha">验证码 <span style="color: #ef4444;">*</span></label>
                    <input type="text" id="captcha" name="captcha" placeholder="请输入验证码" required maxlength="4">
                </div>
                <img src="/captcha" alt="验证码" class="captcha-img" id="captchaImg" onclick="refreshCaptcha()">
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                <span id="btnText">注 册</span>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div class="form-footer">
            <span>已有账号？</span>
            <a href="/login">立即登录</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const roleBtns = document.querySelectorAll('.role-btn');
            const roleInput = document.getElementById('role');

            roleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    roleBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    roleInput.value = this.dataset.role;
                });
            });

            const form = document.getElementById('registerForm');
            const alertDiv = document.getElementById('alert');
            const registerBtn = document.getElementById('registerBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const realName = document.getElementById('real_name').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm_password').value;
                const captcha = document.getElementById('captcha').value;

                if (!username || !realName || !password || !confirmPassword) {
                    showAlert('请填写所有必填项', 'error');
                    return;
                }

                if (password.length < 6) {
                    showAlert('密码长度不能少于6位', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('两次密码不一致', 'error');
                    return;
                }

                if (!captcha) {
                    showAlert('请输入验证码', 'error');
                    return;
                }

                btnText.style.display = 'none';
                loader.style.display = 'block';
                registerBtn.disabled = true;

                const formData = new FormData();
                formData.append('username', username);
                formData.append('real_name', realName);
                formData.append('phone', document.getElementById('phone').value);
                formData.append('password', password);
                formData.append('confirm_password', confirmPassword);
                formData.append('captcha', captcha);
                formData.append('role', roleInput.value);

                fetch('/register', {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                })
                .then(response => response.json())
                .then(data => {
                    btnText.style.display = 'block';
                    loader.style.display = 'none';
                    registerBtn.disabled = false;

                    if (data.code === 1) {
                        showAlert(data.msg, 'success');
                        setTimeout(() => {
                            window.location.href = data.url;
                        }, 2000);
                    } else {
                        refreshCaptcha();
                        showAlert(data.msg, 'error');
                    }
                })
                .catch(error => {
                    btnText.style.display = 'block';
                    loader.style.display = 'none';
                    registerBtn.disabled = false;
                    showAlert('网络错误，请稍后重试', 'error');
                });
            });
        });

        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = msg;
            alertDiv.className = `alert ${type}`;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        function refreshCaptcha() {
            const captchaImg = document.getElementById('captchaImg');
            captchaImg.src = '/captcha?' + Math.random();
        }
    </script>
</body>
</html>

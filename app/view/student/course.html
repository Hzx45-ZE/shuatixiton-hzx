<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程学习 - 信息技术课刷题考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f5f7fa; }
        
        .header {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header .logo { font-size: 18px; font-weight: 600; color: #667eea; }
        
        .header .nav { display: flex; gap: 30px; }
        .header .nav a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            padding: 0 10px;
            line-height: 60px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .header .nav a:hover, .header .nav a.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .header .user { display: flex; align-items: center; gap: 15px; }
        .header .user .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: transform 0.3s ease;
        }
        .header .user .user-avatar:hover { transform: scale(1.1); }
        .header .user .user-name {
            font-size: 14px; color: #333; cursor: pointer; text-decoration: none;
        }
        .header .user .user-name:hover { color: #667eea; }
        .header .user span { font-size: 14px; color: #333; }
        .header .user a { text-decoration: none; color: #666; font-size: 14px; }
        
        .main-content { padding: 20px; }
        
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .course-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.15);
        }
        
        .course-card .cover {
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        
        .course-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .course-card p {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .course-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .course-card .meta span {
            font-size: 13px;
            color: #666;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty i { font-size: 48px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📚 刷题考试系统</div>
        <div class="nav">
            <a href="/student">首页</a>
            <a href="/student/courses" class="active">课程学习</a>
            <a href="/student/practice">在线练习</a>
            <a href="/student/tasks">学习任务</a>
            <a href="/student/exam">模拟考试</a>
            <a href="/student/error">错题本</a>
        </div>
        <div class="user">
            <a href="/student/profile" class="user-avatar">{$user.real_name|mb_substr=0,1}</a>
            <a href="/student/profile" class="user-name">{$user.real_name}</a>
            <a href="/logout">退出</a>
        </div>
    </div>
    
    <div class="main-content">
        {if count($courses) > 0}
        <div class="course-grid">
            {volist name="courses" id="course"}
            <div class="course-card" onclick="location.href='/student/courses/detail?id={$course.id}'">
                <div class="cover">📖</div>
                <h3>{$course.name}</h3>
                <p>{$course.description|default='暂无描述'}</p>
                <div class="meta">
                    <span>授课教师：{$course.teacher.real_name|default='未分配'}</span>
                </div>
            </div>
            {/volist}
        </div>
        {else}
        <div class="empty">
            <i>📚</i>
            <p>暂无可用课程</p>
        </div>
        {/if}
    </div>
</body>
</html>
